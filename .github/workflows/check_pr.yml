name: Build PR

on: [ pull_request ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: true

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: |
                      10.0.x
                      11.0.x

            - name: Build
              run: dotnet build
